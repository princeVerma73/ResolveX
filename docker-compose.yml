version: '3.8'

services:
  backend:
    build: .
    container_name: resolvex_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - resolvex_net

  redis:
    image: redis:7-alpine
    container_name: resolvex_cache
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - resolvex_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: resolvex_vector_db
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - resolvex_net

networks:
  resolvex_net:
    driver: bridge

volumes:
  qdrant_data: